<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="https://ioarts.ink/">
  <title>IOARTS | Digital Art Games Fanart &amp; Illustration Gallery</title>
  <meta name="description" content="Discover unique digital art Games Fanart and illustrations. Official IOARTS Gallery featuring exclusive illustrated arts">
  <meta name="keywords" content="digital art, Games Fanart, illustrations, art Gallery, exclusive designs">
  <meta name="author" content="Anders Altmann">
  <meta name="creator" content="Anders Altmann">
  <meta name="publisher" content="IOARTS">
  <meta name="category" content="Digital art gallery">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:url" content="https://ioarts.ink/">
  <meta property="og:site_name" content="IOARTS">
  <meta property="og:title" content="IOARTS | Digital Art Games Fanart &amp; Illustration Gallery">
  <meta property="og:description" content="Discover unique digital art Games Fanart and illustrations. Official IOARTS Gallery featuring exclusive illustrated arts">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="IOARTS | Digital Art Games Fanart &amp; Illustration Gallery">
  <meta name="twitter:description" content="Discover unique digital art Games Fanart and illustrations.">
  <meta name="twitter:creator" content="@ioarts">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f0f0f'/%3E%3Ctext x='50' y='68' font-size='56' font-weight='700' text-anchor='middle' fill='%23a2a2a2' font-family='sans-serif'%3Eio%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="home.css">
  <script src="shared.js" defer></script>
</head>
<body>
  <div data-site-menu></div>

  <section class="hero">
    <div id="hero-carousel" class="hero-carousel" aria-live="polite">
      <div class="hero-loading">Loading featured products...</div>
    </div>
    <footer class="hero__footer">
      <h1 class="hero__brand">ioarts</h1>
      <h2 class="hero__sub">THE GAMERS FANART GALLERY</h2>
      <p class="hero__blurb">Illustrations that make sense. Free fanart from ioarts and ioartseu. Let's make every product yours for real.</p>
      <p class="hero__author">Anders Altmann</p>
    </footer>
  </section>

  <section class="products-header" aria-label="Products">
    <h2 class="products-heading">Products</h2>
    <div class="filters">
      <div class="filters__group">
        <div id="tag-filters" class="filters__row" role="group" aria-label="Filter by tag"></div>
      </div>
      <div class="filters__group">
        <div id="color-type-filters" class="filters__row" role="group" aria-label="Filter by color type"></div>
      </div>
    </div>
  </section>

  <main id="product-grid" class="gallery" aria-live="polite">
    <p class="empty-state">Loading products...</p>
  </main>
  <div id="load-more-container" class="load-more-container" hidden>
    <button id="load-more-products" class="load-more-button" type="button">Load More</button>
  </div>

  <div data-site-footer></div>

  <script src="javascript.js"></script>
</body>
</html>
